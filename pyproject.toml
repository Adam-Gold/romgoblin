[project]
name = "romgoblin"
version = "0.1.0"
description = "Box art for NextUI handhelds, matched by checksum instead of filename"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Adam Gold" }]
keywords = ["nextui", "minui", "trimui", "boxart", "artwork", "scraper", "screenscraper", "retro", "handheld"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
]
# Standard library only. `zlib` computes the checksum and `urllib` makes the
# request; adding a dependency to save a few lines would be a dependency every
# user installs for the rest of the tool's life.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Adam-Gold/romgoblin"
Issues = "https://github.com/Adam-Gold/romgoblin/issues"

[project.scripts]
romgoblin = "romgoblin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Not under a single target, and that distinction cost a release.
#
# Hatchling honours .gitignore when deciding what to package, and
# `_dev_credentials.py` is git-ignored on purpose - it holds the ScreenScraper
# developer pair, which must never be committed. Both rules are right and
# together they produce a wheel with no credentials in it: every install would
# refuse on first use, and the failure would look like the user's problem.
#
# Exempting it for `targets.wheel` alone looked correct and passed a local
# `build --wheel`. But `python -m build` with no arguments builds the sdist
# first and then builds the wheel *from the extracted sdist* - so a file the
# sdist never carried cannot reach the wheel, whatever the wheel target says.
# Here it applies to both.
#
# This one file, and nothing else.
[tool.hatch.build]
artifacts = ["romgoblin/_dev_credentials.py"]

[tool.hatch.build.targets.wheel]
packages = ["romgoblin"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
